<body>
<div class="container">

    <!-- ====== 首页 ====== -->
    <div id="landing">
        <div class="logo">p<span>6</span>ti</div>
        <div class="subtitle">你 的 性 格 是 哪 一 种 物 理 概 念</div>

        <div class="intro">
            物理不只是一组方程与试验，<br>
            它是宇宙为人类留下的语言。<br>
            而你的存在，是<em>物理语言谱写的诗歌</em>。
            <br><br>
            十六种物理学概念，十六面镜子。<br>
            看看你能从哪一个概念找到<em>自我原型</em>。
        </div>

        <button class="btn" onclick="startQuiz()">开始</button>
        <div class="hint">共25道题 · 不收集任何数据</div>
    </div>

    <!-- ====== 题目 ====== -->
    <div id="quiz">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-number" id="qNumber">01 / 25</div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="goPrev()">上一个</button>
            <button class="nav-btn" id="nextBtn" onclick="goNext()">下一个</button>
        </div>
    </div>

    <!-- ====== 结果 ====== -->
    <div id="result">
        <div class="result-kicker">你的物理性格是</div>
        <div class="result-name" id="resultName"></div>
        <div class="result-en" id="resultEn"></div>

        <div class="result-block">
            <div class="block-label">它是什么</div>
            <div class="block-text science" id="resultScience"></div>
        </div>

        <div class="result-block">
            <div class="block-label">你身上那条定律</div>
            <div class="block-text" id="resultPersonality"></div>
        </div>

        <div class="result-block">
            <div class="block-label">有人说过</div>
            <div class="quote" id="resultQuote"></div>
            <span class="quote-attr" id="resultQuoteAttr"></span>
        </div>

        <div class="result-block">
            <div class="block-label">物理与人的交界</div>
            <div class="bridge" id="resultBridge"></div>
        </div>

        <div class="share-line" id="shareLine"></div>
        <div class="btn-again">
            <button class="btn" onclick="resetQuiz()">再测一次</button>
        </div>
    </div>

</div>

<script>
    // ============================================================
    //  题目数据（25题）
    // ============================================================
    const questions = [
        {
            text: "朋友遇到困难，你通常先做什么？",
            options: [
                { text: "安静听完，不急着给建议。", type: ["entropy", "blackhole"] },
                { text: "帮对方把事情的来龙去脉理清楚，找到能下手的那一步。", type: ["laplace", "kepler"] },
                { text: "先感受对方的情绪，心情跟着波动。", type: ["doppler", "resonance"] },
                { text: "给出一个别人可能没想到的角度，哪怕听起来有点怪。", type: ["uncertainty", "tunneling"] }
            ]
        },
        {
            text: "面对“不确定性”，你更接近哪一种？",
            options: [
                { text: "很难受。我宁愿有一个确定的坏答案，也不想悬着。", type: ["laplace", "inertia"] },
                { text: "可以接受，但我需要时间把它慢慢想清楚。", type: ["entropy", "kepler"] },
                { text: "不确定性本身就是空间。没定下来的时候，一切皆有可能。", type: ["uncertainty", "schrodinger"] },
                { text: "我经常在两种状态之间切换，取决于对面是谁。", type: ["waveParticle", "lorenz"] }
            ]
        },
        {
            text: "在一段关系里，你最看重的是——",
            options: [
                { text: "稳定。不需要轰轰烈烈，但希望轨道是清楚的。", type: ["kepler", "inertia"] },
                { text: "共鸣。频率对上了，比什么都重要。", type: ["resonance", "doppler"] },
                { text: "互相改变。好的关系应该让两个人都偏离原来的路径。", type: ["lorentz", "entanglement"] },
                { text: "在对方身上看到自己没活出来的那一面。", type: ["waveParticle", "darkMatter"] }
            ]
        },
        {
            text: "独处的时候，你的脑子通常在——",
            options: [
                { text: "复盘。把发生过的事一遍遍重放，试图推演“如果当时……”。", type: ["laplace", "lorenz"] },
                { text: "漫游。从一个念头跳到另一个，没有明确方向。", type: ["uncertainty", "doppler"] },
                { text: "构建。在脑子里搭东西，模型、计划、或者一个完整的故事。", type: ["lorentz", "kepler"] },
                { text: "放空。什么都不想，或者想一些根本不存在的东西。", type: ["schrodinger", "blackhole"] }
            ]
        },
        {
            text: "别人形容你，最常出现的是——",
            options: [
                { text: "“靠谱。” 答应的事基本作数。", type: ["inertia", "pauli"] },
                { text: "“看不透。” 身上好像不止一个版本。", type: ["waveParticle", "darkMatter"] },
                { text: "“温度差很大。” 对有的人极热，对有的人极冷。", type: ["lorenz", "doppler"] },
                { text: "“不争不抢，但走得很远。”", type: ["tunneling", "blackhole"] }
            ]
        },
        {
            text: "你更愿意用哪一种方式，留在别人的记忆里？",
            options: [
                { text: "像一个稳定的参照物：能清楚想起对我的印象。", type: ["inertia", "laplace"] },
                { text: "像一阵改变过方向的风：不常想起，但因我而改变过轨迹。", type: ["doppler", "lorentz"] },
                { text: "像一种无法归类的存在：很难用一句话概括。", type: ["waveParticle", "uncertainty"] },
                { text: "像一个安静的容器：在我这里保存着某些东西。", type: ["entropy", "resonance"] }
            ]
        },
        {
            text: "低谷的时候，你靠什么重新动起来？",
            options: [
                { text: "给自己搭一个很小的、确定能完成的结构。", type: ["kepler", "pauli"] },
                { text: "等“想通”的时候。", type: ["schrodinger", "blackhole"] },
                { text: "换一个环境，或者换一个看问题的角度。", type: ["lorentz", "tunneling"] },
                { text: "跟一个人说说话。", type: ["resonance", "entanglement"] }
            ]
        },
        {
            text: "你相信宇宙对人是善意的吗？",
            options: [
                { text: "不相信“善意”，但它的客观比人的“善意”更让我安心。", type: ["laplace", "inertia"] },
                { text: "不知道。但生命能在熵增里维持秩序，这件事本身已经足够温柔。", type: ["entropy", "schrodinger"] },
                { text: "宇宙没有态度，“善意”只来源于人。", type: ["doppler", "resonance"] },
                { text: "我认为没有，但我希望有。", type: ["tunneling", "entanglement"] }
            ]
        },
        {
            text: "你感觉自己的存在更像哪一种？",
            options: [
                { text: "恒定的光——不偏不倚，恒定常在。", type: ["pauli", "inertia"] },
                { text: "弯折空间的引力——安静但能让所有东西都因它偏转。", type: ["blackhole", "darkMatter"] },
                { text: "被观测才确定之物——依托目光而确定自己的存有。", type: ["uncertainty", "waveParticle"] },
                { text: "看不见但影响一切之物——虚己游世，润物无声。", type: ["darkMatter", "entanglement"] }
            ]
        },
        {
            text: "当一件“不可能”的事出现在你面前，你的第一反应是——",
            options: [
                { text: "先试。不试怎么知道不行。", type: ["tunneling", "entanglement"] },
                { text: "先在脑子里推演，看看逻辑上有没有漏洞。", type: ["laplace", "lorenz"] },
                { text: "感觉一下这件事能否引发我的兴致。", type: ["resonance", "doppler"] },
                { text: "既然遇到这种事，怀疑整个方向就不对。", type: ["lorentz", "uncertainty"] }
            ]
        },
        {
            text: "你如何表达“我在乎”？",
            options: [
                { text: "记住对方说过的小事，在某个时刻拿出来。", type: ["entropy", "kepler"] },
                { text: "直接说。", type: ["inertia", "laplace"] },
                { text: "在对方需要的时候出现，不需要的时候不打扰。", type: ["darkMatter", "entanglement"] },
                { text: "发一首歌或一张图，看对方的反应。", type: ["resonance", "doppler"] }
            ]
        },
        {
            text: "你最怕别人怎么看你？",
            options: [
                { text: "“你变了。”", type: ["inertia", "pauli"] },
                { text: "“你想太多了。”", type: ["lorenz", "uncertainty"] },
                { text: "“你根本不在乎。”", type: ["darkMatter", "entropy"] },
                { text: "“你不就是那样吗。”", type: ["waveParticle", "schrodinger"] }
            ]
        },
        {
            text: "一次争吵之后，你通常——",
            options: [
                { text: "需要先冷静，把逻辑理清楚再说话。", type: ["laplace", "kepler"] },
                { text: "很难受，情绪会持续很久，直到对方给一个信号。", type: ["doppler", "resonance"] },
                { text: "会主动退一步，换一个角度看整件事。", type: ["lorentz", "entanglement"] },
                { text: "不太会吵，但心里会记住那个裂缝。", type: ["blackhole", "darkMatter"] }
            ]
        },
        {
            text: "你更愿意被人记住你的——",
            options: [
                { text: "稳定。", type: ["inertia", "kepler"] },
                { text: "独特。", type: ["pauli", "waveParticle"] },
                { text: "深度。", type: ["blackhole", "schrodinger"] },
                { text: "温度。", type: ["resonance", "doppler"] }
            ]
        },
        {
            text: "你如何面对“失去”？",
            options: [
                { text: "会花很长时间复盘。", type: ["laplace", "lorenz"] },
                { text: "接受得很快，但某个瞬间会被一件小事击中。", type: ["entropy", "blackhole"] },
                { text: "相信有些连接不会因为距离而断绝。", type: ["entanglement", "darkMatter"] },
                { text: "不去回想，虽然知道它在。", type: ["schrodinger", "uncertainty"] }
            ]
        },
        {
            text: "你如何面对“孤独”？",
            options: [
                { text: "不太会孤独。", type: ["inertia", "kepler"] },
                { text: "会孤独，但不太会说出口，习惯自己消化。", type: ["blackhole", "darkMatter"] },
                { text: "孤独是常态，它反而能维持自己，人群会消耗我。", type: ["schrodinger", "entropy"] },
                { text: "孤独的时候，会去找自己的深交。", type: ["resonance", "entanglement"] }
            ]
        },
        {
            text: "你做决定时，更依赖——",
            options: [
                { text: "推演。把每一种可能都过一遍。", type: ["laplace", "kepler"] },
                { text: "感觉。身体先知道，脑子后跟上。", type: ["resonance", "doppler"] },
                { text: "直觉。说不清为什么就这么决定了。", type: ["uncertainty", "schrodinger"] },
                { text: "底线。有些事就是不能做，剩下的都可以谈。", type: ["inertia", "pauli"] }
            ]
        },
        {
            text: "你最欣赏的人身上，通常有——",
            options: [
                { text: "一种不慌不忙的确定感。", type: ["kepler", "inertia"] },
                { text: "一种无法被归类的丰富。", type: ["waveParticle", "uncertainty"] },
                { text: "一种安静但巨大的引力。", type: ["blackhole", "darkMatter"] },
                { text: "一种能让周围人共振的频率。", type: ["resonance", "entanglement"] }
            ]
        },
        {
            text: "你如何面对“被误解”？",
            options: [
                { text: "会解释，但只解释一次。", type: ["laplace", "pauli"] },
                { text: "不太解释。懂的人不需要，不懂的人解释也没用。", type: ["blackhole", "darkMatter"] },
                { text: "会难过，但不会因此改变自己。", type: ["inertia", "waveParticle"] },
                { text: "会反思自己的表达方式。", type: ["lorenz", "doppler"] }
            ]
        },
        {
            text: "你更接近哪一种“时间感”？",
            options: [
                { text: "线性。过去、现在、未来，一步一步。", type: ["laplace", "kepler"] },
                { text: "循环。有些事会以不同的面目回来。", type: ["lorenz", "entropy"] },
                { text: "膨胀。越往前走，可能性越多。", type: ["uncertainty", "schrodinger"] },
                { text: "相对。跟对的人在一起，时间会变。", type: ["lorentz", "resonance"] }
            ]
        },
        {
            text: "你身上最矛盾的部分是——",
            options: [
                { text: "想要稳定，又怕被困住。", type: ["inertia", "tunneling"] },
                { text: "渴望靠近，又需要距离。", type: ["entanglement", "doppler"] },
                { text: "理性上想得通，感受上过不去。", type: ["laplace", "lorenz"] },
                { text: "看起来什么都可以，其实心里有强烈的准则。", type: ["waveParticle", "pauli"] }
            ]
        },
        {
            text: "如果用一个物理动作形容你，你选——",
            options: [
                { text: "匀速直线运动，很少偏航。", type: ["inertia", "kepler"] },
                { text: "绕着某个中心转，时近时远。", type: ["kepler", "darkMatter"] },
                { text: "在两个状态之间跃迁，没有中间态。", type: ["schrodinger", "uncertainty"] },
                { text: "穿过一堵墙，不会碰撞。", type: ["tunneling", "entanglement"] }
            ]
        },
        {
            text: "你更愿意相信——",
            options: [
                { text: "一切都有原因，只是还没找到。", type: ["laplace", "kepler"] },
                { text: "有些事就是随机的，没有为什么。", type: ["uncertainty", "entropy"] },
                { text: "原因和结果之间可能非常远。", type: ["lorenz", "blackhole"] },
                { text: "重要的不是原因，是如何面对结果。", type: ["tunneling", "resonance"] }
            ]
        },
        {

            en: "Black Hole · 引力与视界",
            science: "黑洞是广义相对论所预言的一类致密天体，其引力极其强大，使视界内的逃逸速度超过光速，时空曲率大到光也无法从事件视界逃脱。黑洞的核心特征是事件视界，即物质和辐射只能进入、无法逃逸的单向边界。当恒星核燃料耗尽，若核心残余质量超过中子星支撑极限，坍缩将无法停止，最终形成黑洞。中等质量黑洞可能通过黑洞并合逐步成长；超大质量黑洞则可能源于早期宇宙气体云直接坍缩或种子黑洞的持续吸积与并合。黑洞辐射是以量子效应理论推测出的一种由黑洞散发出来的热辐射。",
            personality: "你身上有一种很深的“引力”。别人会被你吸引，但很难真正进入你的内部。你习惯了独自承载一些东西，因为事件视界足够深。但你知道，你仍在向外散发能量。",
            quote: "“如果你感觉自己身处黑洞，不要放弃，总有出路。”",
            quoteAttr: "—— 斯蒂芬·霍金，2016年讲座《Into a Black Hole》",
            bridge: "黑洞的事件视界是单向的，外面的人看不见里面。但黑洞辐射告诉我们，黑洞不是永恒的监狱。你心里那些“出不来”的东西，也在以极其缓慢、极其微小的方式，向外辐射着。",
            share: "我的性格是「黑洞」——深不可测而容纳一切的存在，也可以是太阳吗？"
        }
    };

    // ============================================================
    //  类型顺序（用于遍历与并列时取先）
    // ============================================================
    const TYPE_KEYS = [
        "inertia", "kepler", "laplace",
        "entropy", "lorenz",
        "lorentz",
        "waveParticle", "uncertainty", "schrodinger", "tunneling", "entanglement", "pauli",
        "doppler", "resonance",
        "blackhole", "darkMatter"
    ];

    // ============================================================
    //  状态
    // ============================================================
    let currentIndex = 0;
    let selections = [];   // 每题选中的选项索引，null 表示未选
    let scores = {};

    // ============================================================
    //  函数
    // ============================================================
    function startQuiz() {
        document.getElementById("landing").style.display = "none";
        document.getElementById("quiz").style.display = "block";
        document.getElementById("result").style.display = "none";
        currentIndex = 0;
        selections = new Array(questions.length).fill(null);
        scores = {};
        TYPE_KEYS.forEach(function (k) { scores[k] = 0; });
        renderQuestion();
    }

    function renderQuestion() {
        var q = questions[currentIndex];

        // 题号
        document.getElementById("qNumber").textContent =
            String(currentIndex + 1).padStart(2, "0") + " / " + String(questions.length).padStart(2, "0");

        // 进度 = 已选数量 / 总题数
        var answered = selections.filter(function (s) { return s !== null; }).length;
        document.getElementById("progressFill").style.width = (answered / questions.length * 100) + "%";

        // 题目
        document.getElementById("qText").textContent = q.text;

        // 选项
        var optContainer = document.getElementById("options");
        optContainer.innerHTML = "";
        q.options.forEach(function (opt, i) {
            var btn = document.createElement("button");
            btn.className = "option";
            btn.textContent = opt.text;
            if (selections[currentIndex] === i) {
                btn.classList.add("selected");
            }
            btn.addEventListener("click", function () {
                selectOption(i);
            });
            optContainer.appendChild(btn);
        });

        // 导航按钮状态
        document.getElementById("prevBtn").disabled = (currentIndex === 0);
        var nextBtn = document.getElementById("nextBtn");
        nextBtn.disabled = (selections[currentIndex] === null);
        nextBtn.textContent = (currentIndex === questions.length - 1) ? "查看结果" : "下一个";
    }

    function selectOption(optIndex) {
        // 撤销该题旧选择的加分
        if (selections[currentIndex] !== null) {
            var oldTypes = questions[currentIndex].options[selections[currentIndex]].type;
            oldTypes.forEach(function (t) {
                if (scores[t] !== undefined) scores[t] -= 1;
            });
        }
        // 记录新选择并加分
        selections[currentIndex] = optIndex;
        var newTypes = questions[currentIndex].options[optIndex].type;
        newTypes.forEach(function (t) {
            if (scores[t] !== undefined) scores[t] += 1;
        });
        // 重绘当前题（更新高亮与导航按钮）
        renderQuestion();
    }

    function goPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function goNext() {
        if (selections[currentIndex] === null) return;
        if (currentIndex === questions.length - 1) {
            showResult();
        } else {
            currentIndex++;
            renderQuestion();
        }
    }

    function showResult() {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("result").style.display = "block";

        var bestKey = TYPE_KEYS[0];
        var bestScore = -1;
        TYPE_KEYS.forEach(function (k) {
            if (scores[k] > bestScore) {
                bestScore = scores[k];
                bestKey = k;
            }
        });

        var r = results[bestKey];
        document.getElementById("resultName").textContent = r.name;
        document.getElementById("resultEn").textContent = r.en;
        document.getElementById("resultScience").textContent = r.science;
        document.getElementById("resultPersonality").textContent = r.personality;
        document.getElementById("resultQuote").textContent = r.quote;
        document.getElementById("resultQuoteAttr").textContent = r.quoteAttr;
        document.getElementById("resultBridge").textContent = r.bridge;
        document.getElementById("shareLine").textContent = "“" + r.share + "”";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetQuiz() {
        document.getElementById("result").style.display = "none";
        document.getElementById("landing").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
</script>
